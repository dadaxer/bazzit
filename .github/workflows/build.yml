name: Build Images
on:
  # pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types: [bazzite-updated, bazzite-deck-updated]

jobs:
  bluebuild:
    name: Build Custom Images
    runs-on: ubuntu-latest
    # Pro Rezept eigene Concurrency-Group: ein neuer Build cancelliert nur
    # laufende Builds desselben Rezepts, nicht den parallelen Build des
    # anderen Rezepts (z.B. nach bazzite-updated + bazzite-deck-updated).
    concurrency:
      group: build-${{ matrix.recipe }}-${{ github.ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard Bazzite
          - recipe: bazzit.yml
            event: bazzite-updated
          # Bazzite Deck
          - recipe: bazzit-deck.yml
            event: bazzite-deck-updated

    steps:
      # Dieser Schritt prüft, ob der Build für dieses Rezept laufen soll:
      # 1. Wenn es ein manueller Start oder PR ist -> IMMER bauen
      # 2. Wenn es ein Dispatch ist -> Nur bauen, wenn das Event zum Rezept passt
      - name: Check if build is needed
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            if [[ "${{ github.event.action }}" == "${{ matrix.event }}" ]]; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Custom Image
        if: steps.filter.outputs.run == 'true'
        uses: blue-build/github-action@v1.14
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
